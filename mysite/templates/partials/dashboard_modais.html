<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<script>
    function atualizarNomeMes() {
        const val = "{{ mes_filtro }}";
        if(val) {
            const parts = val.split('-');
            const monthsPT = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
            const m = parseInt(parts[1], 10) - 1;
            const display = document.getElementById('display-month');
            if(display) display.innerText = `${monthsPT[m]} DE ${parts[0]}`;
        }
    }

    function abrirModalExtrato() { 
        try {
            const m = document.getElementById('modal-extrato'), c = document.getElementById('card-extrato'); 
            if(!m) return;
            m.classList.remove('hidden'); m.classList.add('flex'); 
            setTimeout(() => { 
                m.classList.remove('opacity-0'); 
                if(c) c.classList.remove('translate-y-full', 'scale-95'); 
                if(typeof filtrarGastos === 'function') filtrarGastos(window.tabAtivaExtrato || 'TODOS'); 
            }, 10); 
        } catch (e) { console.error("Erro abrir extrato: ", e); }
    }
    
    function fecharModalExtrato() { 
        const m = document.getElementById('modal-extrato'), c = document.getElementById('card-extrato'); 
        if(!m) return; 
        m.classList.add('opacity-0'); 
        if(c) c.classList.add('translate-y-full'); 
        setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300); 
    }

    function abrirModalRenda() { const m = document.getElementById('modal-renda'), c = document.getElementById('card-renda'); m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('scale-95'); }, 10); }
    function fecharModalRenda() { const m = document.getElementById('modal-renda'), c = document.getElementById('card-renda'); m.classList.add('opacity-0'); c.classList.add('scale-95'); setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300); }
    function abrirModalGraficoLinha() { const m = document.getElementById('modal-grafico-linha'); m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(() => { m.classList.remove('opacity-0'); m.children[0].classList.remove('scale-95'); }, 10); }
    function fecharModalGraficoLinha() { const m = document.getElementById('modal-grafico-linha'); m.classList.add('opacity-0'); m.children[0].classList.add('scale-95'); setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300); }
    function abrirModalProjecao() { const m = document.getElementById('modal-projecao'); m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(() => { m.classList.remove('opacity-0'); m.children[0].classList.remove('scale-95'); }, 10); }
    function fecharModalProjecao() { const m = document.getElementById('modal-projecao'); m.classList.add('opacity-0'); m.children[0].classList.add('scale-95'); setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300); }

    function prepararEdicao(elemento) {
        const id = elemento.getAttribute('data-id');
        const desc = elemento.getAttribute('data-descricao');
        const valor = elemento.getAttribute('data-valor');
        const data = elemento.getAttribute('data-data');
        const cat = elemento.getAttribute('data-categoria');
        const q = elemento.getAttribute('data-quinzena');
        const status = elemento.getAttribute('data-status');
        const tipo = elemento.getAttribute('data-tipo');
        abrirModalEditarGasto(id, desc, valor, data, cat, q, status, tipo);
    }

    function toggleEditTipo(tipo) {
        const blocoQuinzena = document.getElementById('edit-bloco-quinzena');
        const inputCategoria = document.getElementById('edit-gasto-categoria');
        const inputValor = document.getElementById('edit-gasto-valor');
        const btnSubmit = document.getElementById('btn-submit-edit');

        if (tipo === 'receita') {
            if(blocoQuinzena) blocoQuinzena.classList.add('hidden');
            if(inputCategoria) {
                inputCategoria.placeholder = "Ex: Salário, Pix...";
                document.getElementById('lista-categorias-edit').innerHTML = `<option value="Salário"><option value="Rendimento"><option value="Venda"><option value="Pix Recebido"><option value="Cashback">`;
            }
            if(inputValor) {
                inputValor.classList.remove('text-gray-800', 'dark:text-white', 'focus:ring-indigo-500');
                inputValor.classList.add('text-emerald-600', 'dark:text-emerald-400', 'focus:ring-emerald-500');
            }
            if(btnSubmit) btnSubmit.className = "flex-[2] px-4 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/20 transition-all active:scale-95 text-xs flex items-center justify-center gap-1.5";
        } else {
            if(blocoQuinzena) blocoQuinzena.classList.remove('hidden');
            if(inputCategoria) {
                inputCategoria.placeholder = "Selecione ou digite";
                document.getElementById('lista-categorias-edit').innerHTML = `<option value="Moradia"><option value="Alimentação"><option value="Transporte"><option value="Lazer"><option value="Saúde">`;
            }
            if(inputValor) {
                inputValor.classList.remove('text-emerald-600', 'dark:text-emerald-400', 'focus:ring-emerald-500');
                inputValor.classList.add('text-gray-800', 'dark:text-white', 'focus:ring-indigo-500');
            }
            if(btnSubmit) btnSubmit.className = "flex-[2] px-4 py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/20 transition-all active:scale-95 text-xs flex items-center justify-center gap-1.5";
        }
    }

    function abrirModalEditarGasto(id, desc, valor, data, cat, q, status, tipo) {
        const form = document.getElementById('form-editar-gasto');

        // ROTA CORRIGIDA DE ACORDO COM O FLASK_APP:
        form.action = '/editar_movimentacao/' + id + '?mes={{ mes_filtro }}';

        document.getElementById('edit-gasto-desc').value = desc;

        // BLINDAGEM DE VALOR: Transforma o número em formato seguro de string (com vírgula)
        const valorAjustado = String(valor).replace(',', '.');
        document.getElementById('edit-gasto-valor').value = parseFloat(valorAjustado).toFixed(2).replace('.', ',');

        // BLINDAGEM DE DATA: Alimenta o input oficial e o fallback (data_gasto)
        document.getElementById('edit-gasto-data').value = data;
        const dataAlt = document.getElementById('edit-gasto-data-alt');
        if(dataAlt) dataAlt.value = data;

        const catField = document.getElementById('edit-gasto-categoria'); if(catField) catField.value = cat;
        const qField = document.getElementById('edit-gasto-quinzena'); if(qField) qField.value = q;
        const statusField = document.getElementById('edit-gasto-status'); if(statusField) statusField.value = status || 'PENDENTE';

        const tipoFiltro = tipo || 'despesa';
        toggleEditTipo(tipoFiltro);

        const radio = document.getElementById('edit-tipo-' + tipoFiltro);
        if (radio) radio.checked = true;

        const m = document.getElementById('modal-editar-gasto'), c = document.getElementById('card-editar-gasto');
        if(m && c) { m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(() => { m.classList.remove('opacity-0'); c.classList.remove('scale-95'); }, 10); }
    }

    function fecharModalEditarGasto() { const m = document.getElementById('modal-editar-gasto'), c = document.getElementById('card-editar-gasto'); if(!m) return; m.classList.add('opacity-0'); if(c) c.classList.add('scale-95'); setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300); }

    document.addEventListener('click', function(e) {
        const modais = [
            {bg: 'modal-extrato', card: 'card-extrato', close: fecharModalExtrato},
            {bg: 'modal-renda', card: 'card-renda', close: fecharModalRenda},
            {bg: 'modal-editar-gasto', card: 'card-editar-gasto', close: fecharModalEditarGasto},
            {bg: 'modal-grafico-linha', card: 'modal-grafico-linha', close: fecharModalGraficoLinha},
            {bg: 'modal-projecao', card: 'modal-projecao', close: fecharModalProjecao}
        ];
        modais.forEach(m => {
            const elBg = document.getElementById(m.bg);
            const elCard = document.getElementById(m.card) || (elBg ? elBg.children[0] : null);
            if (elBg && elCard && e.target === elBg && !elCard.contains(e.target)) m.close();
        });
    });

    function calcularFluxoMes() {
        const renda = parseFloat("{{ renda_total }}".replace(/\./g, '').replace(',', '.')) || 0;
        const gastos = parseFloat("{{ gastos_totais }}".replace(/\./g, '').replace(',', '.')) || 0;
        let perc = (renda > 0) ? (gastos / renda) * 100 : (gastos > 0 ? 100 : 0);
        const t = document.getElementById('texto-fluxo-mes');
        if(t) { if(perc > 100) { t.classList.add('text-red-400'); t.classList.remove('text-gray-900', 'dark:text-white'); } t.innerText = perc.toFixed(1).replace('.', ',') + '%'; }
        const b = document.getElementById('barra-fluxo-mes'); if(b) setTimeout(() => { b.style.width = (perc > 100 ? 100 : perc) + '%'; }, 100);
    }

    function verificarVencimentos() {
        const w = document.getElementById('wrapper-alertas');
        if (w) w.classList.add('hidden'); // Simples hide para a home (o layout cuida dos cards)
    }

    function filtrarGastos(st) {
        window.tabAtivaExtrato = st;
        const abas = ['TODOS', 'PAGO', 'PENDENTE', 'Q1', 'Q2'];
        abas.forEach(id => {
            const b = document.getElementById('tab-' + id);
            if(!b) return;
            if (id === st) b.className = "px-3 py-1.5 text-[10px] font-bold rounded-lg bg-white dark:bg-[#111b21] text-indigo-600 dark:text-indigo-400 shadow-sm transition-all border border-gray-200 dark:border-white/10";
            else b.className = "px-3 py-1.5 text-[10px] font-bold rounded-lg text-gray-500 hover:bg-white dark:hover:bg-[#111b21] hover:text-gray-800 dark:hover:text-gray-100 transition-all border border-transparent";
        });

        let qtdVisiveis = 0; let valorTotal = 0;
        document.querySelectorAll('.item-gasto').forEach(i => {
            const statusItem = i.getAttribute('data-status');
            const quinzenaItem = i.getAttribute('data-quinzena');
            const valorItem = parseFloat(i.getAttribute('data-valor')) || 0;

            const deveAparecer = (st === 'TODOS') || (st === 'PAGO' && statusItem === 'PAGO') || (st === 'PENDENTE' && statusItem !== 'PAGO') || (st === 'Q1' && quinzenaItem === '1') || (st === 'Q2' && quinzenaItem === '2');

            if (deveAparecer) {
                i.style.display = 'flex'; qtdVisiveis++; valorTotal += valorItem;
            } else { i.style.display = 'none'; }
        });

        const msg = document.getElementById('msg-filtro-vazio');
        if (msg) msg.style.display = qtdVisiveis === 0 ? 'block' : 'none';

        const labelTot = document.getElementById('label-totalizador');
        const valorTot = document.getElementById('valor-totalizador');
        if (labelTot && valorTot) {
            let titulo = "Total Selecionado:";
            if (st === 'PAGO') titulo = "Total Já Pago:";
            if (st === 'PENDENTE') titulo = "Total a Pagar:";
            if (st === 'Q1') titulo = "Total da 1ª Quinzena:";
            if (st === 'Q2') titulo = "Total da 2ª Quinzena:";
            labelTot.innerText = titulo;
            valorTot.innerText = "R$ " + valorTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        atualizarNomeMes();
        filtrarGastos('TODOS');
        calcularFluxoMes();

        const isDark = document.documentElement.classList.contains('dark') || document.body.classList.contains('dark') || localStorage.theme === 'dark';
        const textColor = isDark ? '#9ca3af' : '#6b7280';
        const titleColor = isDark ? '#ffffff' : '#111827';
        const trackColor = isDark ? '#1f2937' : '#e5e7eb';

        const pagoPerc = parseFloat("{{ perc_pago }}".replace(',', '.')) || 0;
        let gastosStr = "{{ gastos_totais }}";
        if(gastosStr === "None") gastosStr = "0";
        const hasBills = parseFloat(gastosStr.replace(/\./g, '').replace(',', '.')) > 0;
        const scoreVal = hasBills ? (pagoPerc * 10) : 1000;

        const elGraficoScore = document.querySelector("#grafico-score");
        if(elGraficoScore && typeof ApexCharts !== 'undefined') {

            if (window.graficoScoreChart) {
                window.graficoScoreChart.destroy();
            }
            elGraficoScore.innerHTML = '';

            window.graficoScoreChart = new ApexCharts(elGraficoScore, {
                series: [pagoPerc],
                chart: { type: 'radialBar', height: window.innerWidth < 768 ? 180 : 200, sparkline: { enabled: true }, foreColor: textColor },
                plotOptions: {
                    radialBar: {
                        startAngle: -90, endAngle: 90, hollow: { size: '60%' },
                        track: { background: trackColor, strokeWidth: '100%', margin: 5 },
                        dataLabels: {
                            name: { show: false },
                            value: { offsetY: -5, fontSize: window.innerWidth < 768 ? '18px' : '22px', fontWeight: 700, color: titleColor, formatter: function () { return scoreVal.toFixed(0); } }
                        }
                    }
                },
                fill: { type: 'gradient', gradient: { shade: isDark ? 'dark' : 'light', type: 'horizontal', colorStops: [ { offset: 0, color: '#ef4444', opacity: 1 }, { offset: 50, color: '#eab308', opacity: 1 }, { offset: 100, color: '#22c55e', opacity: 1 } ] } },
                stroke: { lineCap: 'round' }
            });
            window.graficoScoreChart.render();
        }

        // ==============================================================================
        // GRÁFICO: ENTRADAS E SAÍDAS
        // ==============================================================================
        const elGraficoES = document.querySelector("#grafico-entradas-saidas");
        if(elGraficoES && typeof ApexCharts !== 'undefined') {

            var optionsES = {
                series: [{
                    name: 'Entradas',
                    data: {{ entradas_grafico_es | tojson | safe }}
                }, {
                    name: 'Saídas',
                    data: {{ saidas_grafico_es | tojson | safe }}
                }],
                chart: {
                    type: 'bar',
                    height: 180,
                    stacked: true,
                    toolbar: { show: false },
                    parentHeightOffset: 0
                },
                colors: ['#10b981', '#cbd5e1'],
                plotOptions: {
                    bar: {
                        borderRadius: 5,
                        columnWidth: '35%',
                        borderRadiusApplication: 'end',
                        borderRadiusWhenStacked: 'all'
                    }
                },
                dataLabels: { enabled: false },
                stroke: { width: 0 },
                xaxis: {
                    categories: {{ labels_grafico_es | tojson | safe }},
                    axisBorder: { show: false },
                    axisTicks: { show: false },
                    labels: {
                        style: { colors: '#9ca3af', fontSize: '14px', fontWeight: 600, fontFamily: 'inherit' },
                        offsetY: 5
                    }
                },
                yaxis: {
                    show: false,
                },
                grid: {
                    show: true,
                    borderColor: '#e5e7eb',
                    strokeDashArray: 0,
                    position: 'back',
                    xaxis: { lines: { show: false } },
                    yaxis: { lines: { show: true } },
                    padding: { top: 0, right: 0, bottom: 0, left: 10 }
                },
                legend: { show: false },
                tooltip: {
                    y: {
                        formatter: function (val) {
                            return "R$ " + Math.abs(val).toLocaleString('pt-BR', {minimumFractionDigits: 2});
                        }
                    }
                }
            };

            var chartES = new ApexCharts(elGraficoES, optionsES);
            chartES.render();
        }
        
        // ==============================================================================
        // GRÁFICO: CATEGORIAS (DONUT)
        // ==============================================================================
        const elGraficoDonut = document.querySelector("#grafico-donut-container");
        if(elGraficoDonut && typeof ApexCharts !== 'undefined') {
            
            const labelsCat = {{ labels_categorias | tojson | safe }};
            const valoresCat = {{ valores_categorias | tojson | safe }};
            
            // Só desenha se tiver algum gasto no mês (evita rosca em branco dando erro)
            if (valoresCat.length > 0 && valoresCat.some(v => v > 0)) {
                var optionsDonut = {
                    series: valoresCat,
                    labels: labelsCat,
                    chart: {
                        type: 'donut',
                        height: 280,
                        background: 'transparent'
                    },
                    colors: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#ec4899', '#f97316'],
                    plotOptions: {
                        pie: {
                            donut: {
                                size: '75%',
                                background: 'transparent',
                                labels: {
                                    show: true,
                                    name: { show: true, fontSize: '11px', color: textColor, offsetY: -10 },
                                    value: {
                                        show: true, 
                                        fontSize: '18px', 
                                        fontWeight: 800, 
                                        color: titleColor,
                                        formatter: function (val) {
                                            return "R$ " + parseFloat(val).toLocaleString('pt-BR', {minimumFractionDigits: 2});
                                        }
                                    },
                                    total: {
                                        show: true,
                                        showAlways: true,
                                        label: 'Total',
                                        fontSize: '11px',
                                        color: textColor,
                                        formatter: function (w) {
                                            const total = w.globals.seriesTotals.reduce((a, b) => a + b, 0);
                                            return "R$ " + total.toLocaleString('pt-BR', {minimumFractionDigits: 2});
                                        }
                                    }
                                }
                            }
                        }
                    },
                    stroke: { show: true, colors: isDark ? ['#1a1b26'] : ['#ffffff'], width: 3 },
                    dataLabels: { enabled: false },
                    legend: {
                        show: true,
                        position: 'bottom',
                        fontSize: '11px',
                        labels: { colors: textColor },
                        markers: { width: 8, height: 8, radius: 12 }
                    },
                    tooltip: {
                        y: {
                            formatter: function (val) {
                                return "R$ " + parseFloat(val).toLocaleString('pt-BR', {minimumFractionDigits: 2});
                            }
                        }
                    }
                };

                var chartDonut = new ApexCharts(elGraficoDonut, optionsDonut);
                chartDonut.render();
            }
        }
    });

    function extrairValoresDoFundo(html) {
        const parser = new DOMParser();
        const novoDoc = parser.parseFromString(html, 'text/html');
        const valoresAtuais = document.querySelectorAll('.valor-sensivel');
        const valoresNovos = novoDoc.querySelectorAll('.valor-sensivel');

        for(let i = 0; i < 3; i++) {
            if(valoresAtuais[i] && valoresNovos[i]) {
                valoresAtuais[i].innerHTML = valoresNovos[i].innerHTML;
                valoresAtuais[i].setAttribute('data-valor', valoresNovos[i].getAttribute('data-valor'));
            }
        }

        const secScoreNovo = novoDoc.getElementById('section-score');

        if (secScoreNovo) {
            const textPagoAntigo = document.getElementById('texto-perc-pago');
            if (textPagoAntigo) textPagoAntigo.innerHTML = novoDoc.getElementById('texto-perc-pago').innerHTML;

            const textPendenteAntigo = document.getElementById('texto-perc-pendente');
            const textPendenteNovo = novoDoc.getElementById('texto-perc-pendente');
            if (textPendenteAntigo && textPendenteNovo) {
                textPendenteAntigo.innerHTML = textPendenteNovo.innerHTML;
                textPendenteAntigo.className = textPendenteNovo.className;
            }

            const novoPercPago = parseFloat(secScoreNovo.getAttribute('data-pago').replace(',', '.')) || 0;
            const novosGastosTotais = secScoreNovo.getAttribute('data-gastos') || "0";
            const hasBills = parseFloat(novosGastosTotais.replace(/\./g, '').replace(',', '.')) > 0;
            const novoScoreVal = hasBills ? (novoPercPago * 10) : 1000;

            if (window.graficoScoreChart) {
                window.graficoScoreChart.updateSeries([novoPercPago]);
                window.graficoScoreChart.updateOptions({
                    plotOptions: {
                        radialBar: {
                            dataLabels: {
                                value: { formatter: function () { return novoScoreVal.toFixed(0); } }
                            }
                        }
                    }
                });
            }
        }
    }

    function excluirSemReload(event, form, id) {
        event.preventDefault();
        const executarExclusaoAJAX = () => {
            const btn = form.querySelector('button');
            btn.innerHTML = '<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i>';
            fetch(form.action, { method: 'POST', body: new FormData(form) }).then(() => {
                const card = document.querySelector(`.item-gasto[data-id="${id}"]`);
                if(card) {
                    card.style.transition = 'all 0.3s ease'; card.style.opacity = '0'; card.style.transform = 'scale(0.9)';
                    setTimeout(() => { card.remove(); filtrarGastos(window.tabAtivaExtrato || 'TODOS'); }, 300);
                }
            });
        };
        if (confirm("Deseja apagar esta despesa?")) executarExclusaoAJAX();
    }

    function editarSemReload(event, form) {
        event.preventDefault();

        // BLINDAGEM DE ROTA: Regex melhorado (Aceita editar_movimentacao ou editar_gasto)
        const idMatch = form.action.match(/\/editar_(?:movimentacao|gasto)\/(\d+)/);

        if (!idMatch) {
            console.error("Erro Crítico na URL de Action. O Regex falhou na tentativa de achar a Rota.");
            return;
        }

        const btn = form.querySelector('button[type="submit"]');
        const txtOriginal = btn.innerHTML;
        btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Salvando...';
        if(typeof lucide !== 'undefined') lucide.createIcons();

        fetch(form.action, { method: 'POST', body: new FormData(form) })
        .then(res => {
            if (!res.ok) throw new Error("Falha no servidor. Verifique os dados.");

            // QUEBRANDO O CACHE: Adiciona o timestamp na URL para forçar atualização
            const currentUrl = window.location.href;
            const sep = currentUrl.includes('?') ? '&' : '?';
            return fetch(currentUrl + sep + 't=' + Date.now());
        })
        .then(res => res.text())
        .then(html => {
            const parser = new DOMParser();
            const novoDoc = parser.parseFromString(html, 'text/html');
            const cardAntigo = document.querySelector(`.item-gasto[data-id="${idMatch[1]}"]`);
            const cardNovo = novoDoc.querySelector(`.item-gasto[data-id="${idMatch[1]}"]`);

            if(cardAntigo && cardNovo) {
                cardAntigo.innerHTML = cardNovo.innerHTML;
                ['data-descricao', 'data-valor', 'data-data', 'data-categoria', 'data-quinzena', 'data-status', 'data-tipo'].forEach(attr => {
                    cardAntigo.setAttribute(attr, cardNovo.getAttribute(attr));
                });
            }

            fecharModalEditarGasto();
            btn.innerHTML = txtOriginal;
            if(typeof lucide !== 'undefined') lucide.createIcons();
            filtrarGastos(window.tabAtivaExtrato || 'TODOS');
            extrairValoresDoFundo(html);
        })
        .catch(err => {
            console.error("Erro:", err);
            btn.innerHTML = txtOriginal;
            if(typeof lucide !== 'undefined') lucide.createIcons();
            alert("Aconteceu um pequeno erro ao salvar. Atualize a página e tente novamente.");
        });
    }

    function statusSemReload(event, form, id) {
        event.preventDefault();
        const card = document.querySelector(`.item-gasto[data-id="${id}"]`);
        if (!card) return;

        let newStatus = card.getAttribute('data-status').toUpperCase() === 'PAGO' ? 'PENDENTE' : 'PAGO';
        card.setAttribute('data-status', newStatus);

        const btn = form.querySelector('button');
        if (newStatus === 'PAGO') {
            btn.className = "px-2.5 py-1.5 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-lg text-[9px] font-bold flex items-center gap-1 transition-colors";
            btn.innerHTML = '<i data-lucide="check-circle" class="w-3 h-3"></i> <span>Pago</span>';
        } else {
            btn.className = "px-2.5 py-1.5 bg-orange-50 dark:bg-orange-500/10 text-orange-600 dark:text-orange-400 rounded-lg text-[9px] font-bold flex items-center gap-1 transition-colors";
            btn.innerHTML = '<i data-lucide="clock" class="w-3 h-3"></i> <span>Pend.</span>';
        }

        if(typeof lucide !== 'undefined') lucide.createIcons();
        filtrarGastos(window.tabAtivaExtrato || 'TODOS');
        fetch(form.action, { method: 'POST', body: new FormData(form) }).catch(err => console.error(err));
    }

    // ==============================================================================
    // MOTOR DE GESTOS (SWIPE MOBILE) - Estilo Aplicativo Nativo
    // ==============================================================================
    document.addEventListener('DOMContentLoaded', () => {
        let touchstartX = 0;
        let touchendX = 0;
        let touchstartY = 0;
        let touchendY = 0;

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        }, {passive: true});

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            processarGesto(e.target);
        }, {passive: true});

        function processarGesto(alvo) {
            let distX = touchendX - touchstartX;
            let distY = touchendY - touchstartY;

            if (Math.abs(distX) > Math.abs(distY) && Math.abs(distX) > 60) {
                if (alvo.closest('.apexcharts-canvas') || alvo.closest('#wrapper-alertas') || alvo.closest('input') || alvo.closest('select')) return;

                let direcao = distX < 0 ? 'esquerda' : 'direita';
                const modalExtrato = document.getElementById('modal-extrato');
                const extratoAberto = modalExtrato && !modalExtrato.classList.contains('hidden');

                if (extratoAberto) {
                    const abas = ['TODOS', 'PAGO', 'PENDENTE', 'Q1', 'Q2'];
                    let abaAtual = window.tabAtivaExtrato || 'TODOS';
                    let index = abas.indexOf(abaAtual);
                    if (direcao === 'esquerda' && index < abas.length - 1) filtrarGastos(abas[index + 1]);
                    else if (direcao === 'direita' && index > 0) filtrarGastos(abas[index - 1]);
                    return;
                }

                const formMes = alvo.closest('form[action="/"]');
                if (formMes) {
                    const inputMes = formMes.querySelector('input[type="month"]');
                    if(inputMes) {
                        let data = new Date(inputMes.value + '-02');
                        data.setMonth(data.getMonth() + (direcao === 'esquerda' ? 1 : -1));
                        inputMes.value = data.toISOString().substring(0, 7);
                        if(document.getElementById('display-month')) {
                            document.getElementById('display-month').innerHTML = '<i data-lucide="loader" class="w-3 h-3 animate-spin"></i>';
                            if(typeof lucide !== 'undefined') lucide.createIcons();
                        }
                        formMes.submit();
                        return;
                    }
                }

                const modalApoio = document.getElementById('modal-apoio');
                const modalPerfil = document.getElementById('modal-perfil');
                const modalOnboarding = document.getElementById('modal-onboarding');

                if ((modalApoio && !modalApoio.classList.contains('hidden')) || 
                    (modalPerfil && !modalPerfil.classList.contains('hidden')) ||
                    (modalOnboarding && !modalOnboarding.classList.contains('hidden'))) return;

                let abaAtual = 0;
                const mGlobal = document.getElementById('modal-global');
                const modalMais = document.getElementById('mobile-menu-mais');

                if (modalMais && !modalMais.classList.contains('translate-y-full')) {
                    abaAtual = 4;
                } else if (mGlobal && !mGlobal.classList.contains('hidden')) {
                    const tituloEl = document.getElementById('titulo-modal-global');
                    if(tituloEl) {
                        const t = tituloEl.innerText.toLowerCase();
                        if (t.includes('compras')) abaAtual = 1;
                        else if (t.includes('movimenta') || t.includes('lançar')) abaAtual = 2;
                        else if (t.includes('caixinhas') || t.includes('metas')) abaAtual = 3;
                        else return; 
                    }
                }

                let novaAba = abaAtual + (direcao === 'esquerda' ? 1 : -1);

                if (novaAba >= 0 && novaAba <= 4 && novaAba !== abaAtual) {
                    if (abaAtual === 4 && typeof toggleMobileMenu === 'function') toggleMobileMenu();

                    if (novaAba === 0) fecharModalGlobal();
                    else if (novaAba === 1) abrirModalAjax('/compras', 'Lista de Compras', 'shopping-cart');
                    else if (novaAba === 2) abrirModalAjax('/movimentacoes', 'Nova Movimentação', 'arrow-right-left');
                    else if (novaAba === 3) abrirModalAjax('/metas', 'Minhas Caixinhas', 'compass');
                    else if (novaAba === 4) {
                        fecharModalGlobal();
                        if (typeof toggleMobileMenu === 'function') toggleMobileMenu();
                    }
                }
            }
        }
    });

    // ==============================================================================
    // MOTOR DO WIZARD DE ONBOARDING
    // ==============================================================================
    let onbPassoAtual = 1;

    function selecionarProfissao(botao, valor) {
        document.querySelectorAll('.prof-btn').forEach(btn => {
            btn.classList.remove('border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/20');
            btn.classList.add('border-gray-100', 'dark:border-gray-800', 'bg-white', 'dark:bg-gray-900');
        });
        botao.classList.remove('border-gray-100', 'dark:border-gray-800', 'bg-white', 'dark:bg-gray-900');
        botao.classList.add('border-indigo-500', 'bg-indigo-50', 'dark:bg-indigo-900/20');
        document.getElementById('onb-profissao').value = valor;
    }

    function atualizarTelaOnboarding() {
        document.getElementById('onboarding-step-1').classList.add('hidden');
        document.getElementById('onboarding-step-2').classList.add('hidden');
        document.getElementById('onboarding-step-3').classList.add('hidden');
        
        document.getElementById(`onboarding-step-${onbPassoAtual}`).classList.remove('hidden');

        const progresso = document.getElementById('onboarding-progress');
        if (onbPassoAtual === 1) progresso.className = "bg-indigo-600 h-1.5 transition-all duration-500 w-1/3";
        if (onbPassoAtual === 2) progresso.className = "bg-purple-500 h-1.5 transition-all duration-500 w-2/3";
        if (onbPassoAtual === 3) progresso.className = "bg-emerald-500 h-1.5 transition-all duration-500 w-full";

        const btnVoltar = document.getElementById('btn-onb-voltar');
        const btnAvancar = document.getElementById('btn-onb-avancar');
        const btnFinalizar = document.getElementById('btn-onb-finalizar');

        if (onbPassoAtual === 1) {
            btnVoltar.classList.add('hidden');
            btnAvancar.classList.remove('hidden');
            btnFinalizar.classList.add('hidden');
        } else if (onbPassoAtual === 2) {
            btnVoltar.classList.remove('hidden');
            btnAvancar.classList.remove('hidden');
            btnFinalizar.classList.add('hidden');
        } else {
            btnVoltar.classList.remove('hidden');
            btnAvancar.classList.add('hidden');
            btnFinalizar.classList.remove('hidden');
            btnFinalizar.classList.add('flex');
        }
    }

    function onboardingAvancar() {
        if (onbPassoAtual === 1) {
            const nome = document.getElementById('onb-nome').value;
            const idade = document.getElementById('onb-idade').value;
            if (!nome || !idade) return alert('Preencha seu nome e idade para continuar!');
        } else if (onbPassoAtual === 2) {
            const prof = document.getElementById('onb-profissao').value;
            if (!prof) return alert('Selecione uma opção de fonte de renda!');
        }
        
        if (onbPassoAtual < 3) {
            onbPassoAtual++;
            atualizarTelaOnboarding();
        }
    }

    function onboardingVoltar() {
        if (onbPassoAtual > 1) {
            onbPassoAtual--;
            atualizarTelaOnboarding();
        }
    }

    function onboardingFinalizar() {
        const patrimonio = document.getElementById('onb-patrimonio').value;
        if (!patrimonio) return alert('Insira um valor aproximado do seu patrimônio!');

        const dados = {
            nome: document.getElementById('onb-nome').value,
            idade: document.getElementById('onb-idade').value,
            profissao: document.getElementById('onb-profissao').value,
            patrimonio: patrimonio
        };

        const btn = document.getElementById('btn-onb-finalizar');
        btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i>';
        if(typeof lucide !== 'undefined') lucide.createIcons();

        fetch('/api/salvar_onboarding', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        })
        .then(res => res.json())
        .then(data => {
            if(data.sucesso) {
                const m = document.getElementById('modal-onboarding');
                m.classList.add('opacity-0');
                setTimeout(() => { m.classList.add('hidden'); m.classList.remove('flex'); }, 300);
                
                Swal.fire({
                    title: 'Perfil Configurado!',
                    text: 'A IA Hir3 já ajustou os relatórios para o seu perfil.',
                    icon: 'success', timer: 3000, showConfirmButton: false
                }).then(() => location.reload()); 
            }
        });
    }

    document.addEventListener("DOMContentLoaded", function() {
        const precisaOnboarding = "{{ precisa_onboarding }}"; 
        if (precisaOnboarding === "True" || precisaOnboarding === "true") {
            setTimeout(() => {
                const m = document.getElementById('modal-onboarding');
                if(m) {
                    m.classList.remove('hidden'); m.classList.add('flex');
                    setTimeout(() => m.classList.remove('opacity-0'), 50);
                }
            }, 1000); 
        }
    });
</script>
