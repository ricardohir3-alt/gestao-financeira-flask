    const listaIdiomas = ['PT-BR', 'EN-US', 'ZH-CN'];

    function cicloIdioma() {
        let idiomaAtual = localStorage.getItem('idioma_sistema') || 'PT-BR';
        let proximoIdioma = listaIdiomas[(listaIdiomas.indexOf(idiomaAtual) + 1) % listaIdiomas.length];
        localStorage.setItem('idioma_sistema', proximoIdioma);

        const labelNoMenu = document.getElementById('texto-idioma');
        if(labelNoMenu) labelNoMenu.innerText = proximoIdioma;

        window.aplicarTraducao(proximoIdioma);
    }

    window.aplicarTraducao = function(idioma) {
        const dicionario = dicionarioGlobal[idioma] || dicionarioGlobal['PT-BR'];

        // 1. Traduz todos os elementos
        document.querySelectorAll('[data-i18n]').forEach(elemento => {
            const chave = elemento.getAttribute('data-i18n');
            if (dicionario[chave]) {
                // SE for um input com placeholder, traduz o placeholder em vez do texto interno
                if (elemento.tagName === 'INPUT' || elemento.tagName === 'TEXTAREA') {
                    elemento.placeholder = dicionario[chave];
                } else {
                    // Respeita os ícones que possam estar dentro do innerHTML se houver
                    elemento.innerHTML = dicionario[chave];
                }
            }
        });

        // 2. Dispara evento para o Dashboard JS atualizar os textos dinâmicos (como o Totalizador)
        window.dispatchEvent(new CustomEvent('idiomaTrocado', { detail: idioma }));

        if(typeof atualizarNomeMes === 'function') atualizarNomeMes();
        if(typeof lucide !== 'undefined') lucide.createIcons();
    }

    document.addEventListener("DOMContentLoaded", () => {
        let idiomaAtual = localStorage.getItem('idioma_sistema') || 'PT-BR';
        const labelNoMenu = document.getElementById('texto-idioma');
        if(labelNoMenu) labelNoMenu.innerText = idiomaAtual;
        window.aplicarTraducao(idiomaAtual);
    });
</script>
